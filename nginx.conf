server {
    listen 80;
    server_name zip.nlpdf.site _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;   # no request logs

    # The page itself may not make any network connection.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }

    # nginx's built-in MIME list has no entry for .webmanifest; set it for this file only.
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        types { }
        default_type application/manifest+json;
    }

    # The service worker only needs to fetch the app's own files to cache them for offline use.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'" always;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
